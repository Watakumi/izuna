# 自宅の Forgejo Actions で回す検査。
#
# Forgejo は .forgejo/workflows/ を読み、無ければ .github/workflows/ に落ちる。
# macOS には runner のバイナリが無い（リリースは linux-amd64 / linux-arm64 だけ）ので、
# runner は Docker で回す。詳しくは docs/ACTIONS.md。
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: docker
    container:
      # タグは動く。ダイジェストで固定する（node:24 の 2026-09-08 時点）
      image: node:24@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    steps:
      # v4 の 2026-09-08 時点のコミット。タグは付け替えられる
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: pnpm を用意する
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: 依存を入れる
        # Electron のバイナリは検査に要らない。落とさないぶん速い
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: 型と検査
        # IZUNA_CI=1 は「手元の環境を見る検査」を外す。
        # claude CLI はコンテナに無く、それはコードの問題ではない（CLAUDE.md §15）
        env:
          IZUNA_CI: '1'
        run: pnpm verify

      - name: 既知の脆弱性
        # 落とさない。直せないもの（CLAUDE.md §26 の extract-zip）があるので、
        # ここは「気づく経路」であって門ではない
        continue-on-error: true
        run: pnpm audit --audit-level high
