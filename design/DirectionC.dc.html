<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #e8a33d; } a:hover { color: #f5bd68; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .box { border: 1.5px dashed #454b5a; border-radius: 8px; }
    .fill { background: #1e222b; border-radius: 5px; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #16181d; color: #9aa2b4; font-size: 13px; overflow: hidden; padding: 26px; box-sizing: border-box; gap: 18px;">
  <div style="display: flex; align-items: baseline; gap: 14px; flex-shrink: 0;">
    <span style="font-size: 19px; font-weight: 600; color: #e6e8ee;">単一の流れ</span>
    <span style="font-size: 13px; color: #7d8598;">1画面1セッションに集中。切り替えは ⌘K。承認だけが画面をまたぐキュー</span>
    <div style="flex-grow: 1;"></div>
    <span class="mono" style="font-size: 11px; color: #4a5164;">DirectionC · 低精度</span>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0;">
      <div class="box" style="border-color: #5a4a2c; flex-shrink: 0; padding: 12px 15px; display: flex; align-items: center; gap: 13px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #e8a33d;"></span>
        <span style="color: #c8cddb; font-size: 12.5px;">承認キュー</span>
        <span class="mono" style="font-size: 11px; color: #636b7e;">feat/palette · Edit</span>
        <div style="flex-grow: 1;"></div>
        <div style="width: 84px; height: 26px; border-radius: 5px; background: #e8a33d;"></div>
        <div class="box" style="width: 84px; height: 26px;"></div>
      </div>
      <div class="box" style="flex-grow: 1; display: flex; flex-direction: column; gap: 13px; padding: 20px 24px; min-height: 0;">
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="color: #e6e8ee; font-size: 14px;">/ パレットの補完</span>
          <span class="mono" style="font-size: 11px; color: #636b7e;">feat/palette</span>
          <div style="flex-grow: 1;"></div>
          <span class="mono" style="font-size: 11px; color: #4a5164;">&#8984;K で切り替え</span>
        </div>
        <div class="fill" style="height: 34px; width: 52%; align-self: flex-end; border-radius: 9px;"></div>
        <div class="fill" style="height: 12px; width: 82%;"></div>
        <div class="fill" style="height: 12px; width: 71%;"></div>
        <div class="fill" style="height: 74px;"></div>
        <div class="fill" style="height: 12px; width: 60%;"></div>
        <div style="flex-grow: 1;"></div>
        <div class="box" style="height: 42px;"></div>
      </div>
    </div>
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding-top: 4px;">
      <span style="font-size: 12px; color: #7d8598;">利点: 1つに深く集中できる。画面が広く使える</span>
      <div style="flex-grow: 1;"></div>
      <span style="font-size: 12px; color: #6c7488;">難点: 他のセッションの状況が見えない</span>
    </div>
</div>
</x-dc>
</body>
</html>
