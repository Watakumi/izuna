# セキュリティの走査。秘密（gitleaks）・依存の脆弱性（osv-scanner）・Electron の設定（electronegativity）。
# gitleaks と osv-scanner は門（落ちたら赤）。electronegativity は気づく経路（落とさない）。
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # 週に 1 回。新しい advisory を拾う

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # 履歴ごと見る
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          # 除外は osv-scanner.toml（理由付き）。直せないもの以外は落とす
          scan-args: |
            --lockfile=pnpm-lock.yaml
            --config=osv-scanner.toml

  electron:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: 依存を入れる
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: 組み立てる
        run: pnpm build
      - name: electronegativity
        # Electron の設定の診断（Doyensec）。指摘は artifact で読む。落とさない
        continue-on-error: true
        run: npx --yes @doyensec/electronegativity@1.10.3 -i out -o electronegativity.csv || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electronegativity
          path: electronegativity.csv
          if-no-files-found: ignore
