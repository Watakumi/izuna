# セキュリティの走査。秘密（gitleaks）・依存の脆弱性（osv-scanner）・Electron の設定（electronegativity）。
# gitleaks と osv-scanner は門（落ちたら赤）。electronegativity は気づく経路（落とさない）。
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # 週に 1 回。新しい advisory を拾う

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # pull_request のとき、action が PR のコミット一覧を API で読む（無いと 403。2026-09-09 に踏んだ）
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # 履歴ごと見る
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          # 除外は osv-scanner.toml（理由付き）。直せないもの以外は落とす
          scan-args: |
            --lockfile=pnpm-lock.yaml
            --config=osv-scanner.toml

  electron:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: 依存を入れる
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: 組み立てる
        run: pnpm build
      - name: electronegativity
        # Electron の設定の診断（Doyensec）。指摘は artifact で読む。落とさない
        continue-on-error: true
        run: npx --yes @doyensec/electronegativity@1.10.3 -i out -o electronegativity.csv || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electronegativity
          path: electronegativity.csv
          if-no-files-found: ignore
