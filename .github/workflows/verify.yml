# GitHub 側の検査（配布のため。自宅の Forgejo の分は .forgejo/workflows/verify.yml）。
# action はタグではなくコミットで固定する（タグは付け替えられる。§27）。
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: 依存を入れる
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: 型と検査
        # IZUNA_CI=1 は「手元の環境を見る検査」を外す（claude はここに無い。docs/ACTIONS.md）
        env:
          IZUNA_CI: '1'
        run: pnpm verify
