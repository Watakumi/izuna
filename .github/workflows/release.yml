# 配布物（macOS の DMG）。タグ v* を押したときだけ組み立てて Release に付ける。
# 署名と公証は secrets があるときだけ（無ければ署名無しの DMG。開くには右クリック → 開く が要る）。
# 自動更新は持たない（docs/GOAL.md やらないこと）。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: 依存を入れる
        run: pnpm install --frozen-lockfile
      - name: 型と検査
        env:
          IZUNA_CI: '1'
        run: pnpm verify
      - name: DMG を組む
        # 証明書と Apple ID が secrets にあるときだけ署名と公証に渡す。
        # 無い secret を空文字のまま CSC_LINK に渡すと electron-builder はそれをファイルのパスと読み、
        # 「<repo> not a file」で落ちる（2026-09-10 の初回で踏んだ。§7）。無ければ自動探索も切る
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            export CSC_LINK="$MAC_CERT_P12" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            export APPLE_ID="$APPLE_ID_SECRET" APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
          else
            echo "証明書が無いので署名しない（開くには右クリック → 開く。docs/SETUP.md）"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm build:mac
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
